server.port=${PORT:8080}

# Database Mode: auto (MONGO_URL -> mongo, DATABASE_URL -> postgres/jpa, fallback -> h2/jpa), jpa, or mongo
app.db.type=${APP_DB_TYPE:auto}

# MongoDB Configurations (active when mongo mode is selected)
spring.data.mongodb.database=${MONGO_DATABASE:stockdb}
spring.data.mongodb.auto-index-creation=true

# H2 Database Configurations (default local fallback when no external DB URL is provided)
spring.datasource.url=jdbc:h2:mem:stockdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Allow H2 Console within Frame Options (for security config)
spring.headers.frame-options=sameorigin
